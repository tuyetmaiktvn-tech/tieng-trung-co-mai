    const key = name => `${lessonData.id}:${name}`;

    const state = {
      theme: localStorage.getItem("site-theme") || "light",
      favorites: JSON.parse(localStorage.getItem(key("favorites")) || "[]"),
      completed: JSON.parse(localStorage.getItem(key("completed")) || "[]"),
      notes: localStorage.getItem(key("notes")) || "",
      quizScore: Number(localStorage.getItem(key("quizScore")) || 0),
      hidePinyin: localStorage.getItem(key("hidePinyin")) === "true",
      hideVi: localStorage.getItem(key("hideVi")) === "true"
    };

    document.documentElement.dataset.theme = state.theme;

    function saveState(){
      localStorage.setItem(key("favorites"),JSON.stringify(state.favorites));
      localStorage.setItem(key("completed"),JSON.stringify(state.completed));
      localStorage.setItem(key("notes"),state.notes);
      localStorage.setItem(key("quizScore"),String(state.quizScore));
      localStorage.setItem(key("hidePinyin"),String(state.hidePinyin));
      localStorage.setItem(key("hideVi"),String(state.hideVi));
    }

    const $$ = selector => [...document.querySelectorAll(selector)];

    function esc(text=""){
      return String(text).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function normalize(text=""){
      return text.toLowerCase().replace(/[，。！？,.!?]/g,"").replace(/\s+/g,"").trim();
    }

    function speak(text,audioUrl=""){
      if(audioUrl){
        const audio = new Audio(audioUrl);
        audio.play().catch(()=>{});
        return;
      }
      if("speechSynthesis" in window){
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = 0.85;
        speechSynthesis.speak(utterance);
      } else {
        alert("Trình duyệt chưa hỗ trợ phát âm tự động.");
      }
    }

    function sectionShell(id,icon,title,subtitle,content){
      const done = state.completed.includes(id);
      return `
        <section class="section" id="${id}">
          <div class="container">
            <div class="section-heading">
              <div><h2>${icon} ${title}</h2><p>${subtitle}</p></div>
              <button class="complete-btn ${done?"done":""}" data-complete="${id}">
                ${done?"✓ Đã hoàn thành":"Đánh dấu hoàn thành"}
              </button>
            </div>
            ${content}
          </div>
        </section>`;
    }

    /* =========================================================
       4. RENDER TOÀN BỘ BÀI HỌC
       ========================================================= */
    function render(){
      const app = $("#app");

      const objectives = sectionShell(
        "objectives","🎯","Mục tiêu","Học xong bài này, học viên có thể:",
        `<div class="grid-4">${lessonData.objectives.map((x,i)=>`
          <article class="objective"><strong>${i+1}</strong><p>${esc(x)}</p></article>`).join("")}</div>`
      );

      const vocab = sectionShell(
        "vocabulary","📖","Từ mới","Tìm kiếm, nghe phát âm và đánh dấu từ yêu thích.",
        `<div class="section-card">
          <div class="search-row">
            <input id="vocabSearch" placeholder="🔍 Tìm chữ Hán, pinyin hoặc nghĩa tiếng Việt...">
            <button class="btn" id="clearSearch">Xóa tìm kiếm</button>
          </div>
          <div class="grid-4" id="vocabGrid"></div>
          <div class="favorite-panel" id="favoritePanel">
            <h3>⭐ Từ đã lưu</h3>
            <div class="favorite-list" id="favoriteList"></div>
          </div>
        </div>`
      );

      const memory = sectionShell(
        "memory","🧠","Ghi nhớ nhanh","Các công thức cần nhớ.",
        `<div class="grid-4">${lessonData.memory.map(x=>`
          <article class="memory-item"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p></article>`).join("")}</div>`
      );

      const grammar = sectionShell(
        "grammar","📚","Ngữ pháp","Giải thích công thức, cách dùng và ví dụ.",
        `<div class="grid-2">${lessonData.grammar.map(g=>`
          <article class="grammar-card">
            <h3>${esc(g.title)}</h3>
            <p>${esc(g.explanation)}</p>
            <div class="formula">${esc(g.formula)}</div>
            <ul>${g.examples.map(e=>`<li>${esc(e)} <button class="mini-btn speak-btn" data-speak="${esc(e)}">🔊</button></li>`).join("")}</ul>
            <div class="note">${esc(g.note)}</div>
          </article>`).join("")}</div>`
      );

      const mistakes = sectionShell(
        "mistakes","⚠️","Lỗi người Việt thường mắc","Nhận diện lỗi và ghi nhớ cách sửa.",
        `<div class="grid-2">${lessonData.mistakes.map(m=>`
          <article class="mistake-card">
            <h3>${esc(m.title)}</h3>
            <p class="wrong">✘ ${esc(m.wrong)}</p>
            <p class="correct">✔ ${esc(m.correct)}</p>
            <p><strong>Mẹo:</strong> ${esc(m.tip)}</p>
          </article>`).join("")}</div>`
      );

      const mindmap = sectionShell(
        "mindmap","🗺️","Mindmap","Sơ đồ liên kết kiến thức của bài.",
        `<div class="section-card mindmap">
          <div class="mind-col">${lessonData.mindmap.left.map(x=>`<div class="mind-node">${esc(x)}</div>`).join("")}</div>
          <div class="mind-node mind-center">${esc(lessonData.mindmap.center)}</div>
          <div class="mind-col">${lessonData.mindmap.right.map(x=>`<div class="mind-node">${esc(x)}</div>`).join("")}</div>
        </div>`
      );

      const dialogue = sectionShell(
        "dialogue","🎭","Hội thoại","Nghe từng câu, ẩn pinyin hoặc bản dịch để luyện.",
        `<div class="section-card">
          <div class="hero-actions" style="margin-top:0;margin-bottom:16px">
            <button class="btn" id="togglePinyin">${state.hidePinyin?"Hiện pinyin":"Ẩn pinyin"}</button>
            <button class="btn" id="toggleVi">${state.hideVi?"Hiện bản dịch":"Ẩn bản dịch"}</button>
          </div>
          <div class="dialogue-list">${lessonData.dialogues.map(d=>`
            <div class="bubble ${d.side==="right"?"right":""}">
              <div class="speaker">${esc(d.speaker)} <button class="mini-btn dialogue-speak" data-text="${esc(d.hanzi)}" data-audio="${esc(d.audio)}">🔊</button></div>
              <div>${esc(d.hanzi)}</div>
              <div class="pinyin-line ${state.hidePinyin?"hide":""}">${esc(d.pinyin)}</div>
              <div class="vi-line ${state.hideVi?"hide":""}">${esc(d.vi)}</div>
            </div>`).join("")}</div>
        </div>`
      );

      const listening = sectionShell(
        "listening","🎧","Luyện nghe","Nghe và trả lời câu hỏi.",
        `<div class="section-card">
          <div class="audio-block">
            <div><strong>${esc(lessonData.listening.title)}</strong><p>${esc(lessonData.listening.instruction)}</p></div>
            <button class="btn btn-primary" id="listenPlay">▶ Phát âm thanh</button>
          </div>
          <div class="quiz-question" style="margin-top:14px">
            <h3>${esc(lessonData.listening.question)}</h3>
            ${lessonData.listening.options.map((o,i)=>`<label><input type="radio" name="listenQ" value="${i}"> ${esc(o)}</label>`).join("")}
            <button class="btn" id="checkListening">Kiểm tra</button>
            <div id="listeningFeedback" class="feedback"></div>
          </div>
        </div>`
      );

      const speaking = sectionShell(
        "speaking","🗣️","Luyện nói","Nói theo khung và thay bằng thông tin cá nhân.",
        `<div class="grid-3">${lessonData.speaking.map((x,i)=>`
          <article class="objective"><strong>Khung ${i+1}</strong><p>${esc(x)}</p>
          <button class="mini-btn speaking-speak" data-text="${esc(x.split("—")[0])}">🔊</button></article>`).join("")}</div>`
      );

      const exercises = sectionShell(
        "exercises","✍️","Bài tập","Nhập đáp án và kiểm tra ngay.",
        `<div class="section-card">
          ${lessonData.exercises.map((e,i)=>`
            <div class="exercise">
              <strong>${i+1}. ${esc(e.question)}</strong>
              <input id="${e.id}" placeholder="Nhập đáp án">
              <div class="feedback" id="${e.id}-feedback"></div>
            </div>`).join("")}
          <button class="btn btn-primary" id="checkExercises">Kiểm tra bài tập</button>
        </div>`
      );

      const quiz = sectionShell(
        "quiz","🎮","Quiz","Chấm điểm tự động và lưu kết quả cao nhất.",
        `<div class="section-card">
          ${lessonData.quiz.map((q,qi)=>`
            <div class="quiz-question">
              <h3>${qi+1}. ${esc(q.question)}</h3>
              ${q.options.map((o,oi)=>`<label><input type="radio" name="${q.id}" value="${oi}"> ${esc(o)}</label>`).join("")}
            </div>`).join("")}
          <button class="btn btn-primary" id="gradeQuiz">Chấm điểm</button>
          <div class="score-box" id="scoreBox"></div>
        </div>`
      );

      const summary = sectionShell(
        "summary","📑","Tổng kết","Ôn lại nội dung cốt lõi.",
        `<div class="grid-3">${lessonData.summary.map(x=>`
          <article class="summary-item"><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p></article>`).join("")}</div>`
      );

      const flashcards = sectionShell(
        "flashcards","📥","Flashcard","Bấm để lật; đánh dấu từ đã nhớ hoặc chưa nhớ.",
        `<div class="flashcards">${lessonData.flashcards.map(f=>`
          <div class="flashcard" data-card="${f.id}" tabindex="0">
            <div class="flashcard-inner">
              <div class="flash-face">
                <strong>${esc(f.front)}</strong>
                <span>${esc(f.pinyin)}</span>
                <small>Bấm để lật</small>
              </div>
              <div class="flash-face flash-back">
                <strong>${esc(f.back)}</strong>
                <span>${esc(f.example)}</span>
                <div class="flash-actions">
                  <button class="btn remembered-btn" data-id="${f.id}">😊 Đã nhớ</button>
                  <button class="btn review-btn" data-id="${f.id}">🤔 Chưa nhớ</button>
                </div>
              </div>
            </div>
          </div>`).join("")}</div>`
      );

      const notes = sectionShell(
        "notes","📝","Ghi chú cá nhân","Nội dung được tự động lưu trên trình duyệt.",
        `<div class="section-card">
          <textarea class="notes-area" id="notesArea" rows="7" placeholder="Viết ghi chú của bạn tại đây...">${esc(state.notes)}</textarea>
          <p id="noteStatus" style="color:var(--muted)">Đã bật tự động lưu.</p>
        </div>`
      );

      app.innerHTML = `
        <section class="hero">
          <div class="container hero-grid">
            <div class="hero-card">
              <span class="eyebrow">🎬 ${esc(lessonData.level)} • BÀI ${lessonData.lesson}</span>
              <h1>${esc(lessonData.title)}</h1>
              <p class="subtitle">${esc(lessonData.titleVi)}</p>
              <p>${esc(lessonData.intro)}</p>
              <div class="hero-actions">
                <a class="btn btn-primary" href="#objectives">Bắt đầu học</a>
                <a class="btn" href="#flashcards">Ôn flashcard</a>
              </div>
            </div>
            <aside class="lesson-meta">
              <div class="meta-grid">
                <div class="meta-item"><strong>${esc(lessonData.topic)}</strong><span>Chủ đề</span></div>
                <div class="meta-item"><strong>${esc(lessonData.duration)}</strong><span>Thời lượng</span></div>
                <div class="meta-item"><strong>${lessonData.vocabulary.length}</strong><span>Từ mới</span></div>
                <div class="meta-item"><strong>${esc(lessonData.difficulty)}</strong><span>Mức độ</span></div>
              </div>
            </aside>
          </div>
        </section>
        ${objectives}${vocab}${memory}${grammar}${mistakes}${mindmap}${dialogue}
        ${listening}${speaking}${exercises}${quiz}${summary}${flashcards}${notes}
        <section class="section">
          <div class="container">
            <div class="completion" id="completionBox">
              <h2>🏆 Hoàn thành bài học</h2>
              <p>Hoàn thành các phần và đạt ít nhất 80% quiz để kết thúc bài.</p>
              <button class="btn btn-success" id="finishLesson">Kiểm tra hoàn thành</button>
            </div>
          </div>
        </section>`;
    }

    /* =========================================================
       5. RENDER TỪ VỰNG + YÊU THÍCH
       ========================================================= */
    function renderVocabulary(filter=""){
      const grid = $("#vocabGrid");
      const q = normalize(filter);
      const items = lessonData.vocabulary.filter(v =>
        normalize(v.hanzi+" "+v.pinyin+" "+v.meaning+" "+v.type).includes(q)
      );

      grid.innerHTML = items.map(v=>`
        <article class="vocab-card">
          <div class="vocab-actions">
            <button class="mini-btn vocab-speak" data-text="${esc(v.hanzi)}" data-audio="${esc(v.audio)}">🔊</button>
            <button class="mini-btn favorite-btn ${state.favorites.includes(v.id)?"active":""}" data-id="${v.id}">⭐</button>
          </div>
          <div class="hanzi">${esc(v.hanzi)}</div>
          <div class="pinyin">${esc(v.pinyin)}</div>
          <div class="meaning">${esc(v.meaning)}</div>
          <small>${esc(v.type)}</small>
          <div class="example">${esc(v.example)}<br>${esc(v.examplePinyin)}<br>${esc(v.exampleVi)}</div>
        </article>`).join("") || `<p>Không tìm thấy từ phù hợp.</p>`;

      bindVocabularyEvents();
      renderFavorites();
    }

    function renderFavorites(){
      const list = $("#favoriteList");
      if(!list) return;
      const words = lessonData.vocabulary.filter(v=>state.favorites.includes(v.id));
      list.innerHTML = words.length
        ? words.map(v=>`<span class="favorite-chip">${esc(v.hanzi)} · ${esc(v.meaning)}</span>`).join("")
        : "<span>Chưa có từ yêu thích.</span>";
    }

    function bindVocabularyEvents(){
      $$(".vocab-speak").forEach(btn=>btn.onclick=()=>speak(btn.dataset.text,btn.dataset.audio));
      $$(".favorite-btn").forEach(btn=>btn.onclick=()=>{
        const id = btn.dataset.id;
        state.favorites = state.favorites.includes(id)
          ? state.favorites.filter(x=>x!==id)
          : [...state.favorites,id];
        saveState();
        renderVocabulary($("#vocabSearch")?.value || "");
      });
    }

    /* =========================================================
       6. TIẾN ĐỘ
       ========================================================= */
    const trackedSections = ["objectives","vocabulary","memory","grammar","mistakes","mindmap","dialogue","listening","speaking","exercises","quiz","summary","flashcards","notes"];

    function updateProgress(){
      const count = trackedSections.filter(id=>state.completed.includes(id)).length;
      const percent = Math.round(count / trackedSections.length * 100);
      $("#progressFill").style.width = percent+"%";
      $("#progressText").textContent = percent+"%";
      $$(".complete-btn").forEach(btn=>{
        const done = state.completed.includes(btn.dataset.complete);
        btn.classList.toggle("done",done);
        btn.textContent = done ? "✓ Đã hoàn thành" : "Đánh dấu hoàn thành";
      });
    }

    function toggleComplete(id){
      state.completed = state.completed.includes(id)
        ? state.completed.filter(x=>x!==id)
        : [...state.completed,id];
      saveState();
      updateProgress();
    }

    /* =========================================================
       7. SỰ KIỆN
       ========================================================= */
    function bindEvents(){
      $$(".complete-btn").forEach(btn=>btn.onclick=()=>toggleComplete(btn.dataset.complete));

      $("#vocabSearch").addEventListener("input",e=>renderVocabulary(e.target.value));
      $("#clearSearch").onclick=()=>{
        $("#vocabSearch").value="";
        renderVocabulary("");
      };

      $("#favoritesToggle").onclick=()=>{
        $("#favoritePanel").classList.toggle("show");
        location.hash="#vocabulary";
      };

      $("#themeToggle").onclick=()=>{
        state.theme = state.theme==="dark" ? "light" : "dark";
        document.documentElement.dataset.theme = state.theme;
        localStorage.setItem("site-theme",state.theme);
        $("#themeToggle").textContent = state.theme==="dark" ? "☀️" : "🌙";
      };
      $("#themeToggle").textContent = state.theme==="dark" ? "☀️" : "🌙";

      $$(".speak-btn").forEach(btn=>btn.onclick=()=>speak(btn.dataset.speak));
      $$(".dialogue-speak").forEach(btn=>btn.onclick=()=>speak(btn.dataset.text,btn.dataset.audio));
      $$(".speaking-speak").forEach(btn=>btn.onclick=()=>speak(btn.dataset.text));

      $("#togglePinyin").onclick=()=>{
        state.hidePinyin=!state.hidePinyin;
        saveState();
        $$(".pinyin-line").forEach(el=>el.classList.toggle("hide",state.hidePinyin));
        $("#togglePinyin").textContent=state.hidePinyin?"Hiện pinyin":"Ẩn pinyin";
      };
      $("#toggleVi").onclick=()=>{
        state.hideVi=!state.hideVi;
        saveState();
        $$(".vi-line").forEach(el=>el.classList.toggle("hide",state.hideVi));
        $("#toggleVi").textContent=state.hideVi?"Hiện bản dịch":"Ẩn bản dịch";
      };

      $("#listenPlay").onclick=()=>{
        const l = lessonData.listening;
        if(l.audio) new Audio(l.audio).play().catch(()=>{});
        else speak("你的手机号是多少？");
      };

      $("#checkListening").onclick=()=>{
        const selected = document.querySelector('input[name="listenQ"]:checked');
        const fb = $("#listeningFeedback");
        if(!selected){fb.innerHTML='<span class="wrong">Hãy chọn một đáp án.</span>';return}
        fb.innerHTML = Number(selected.value)===lessonData.listening.answer
          ? '<span class="correct">✓ Chính xác</span>'
          : '<span class="wrong">✘ Chưa đúng</span>';
      };

      $("#checkExercises").onclick=()=>{
        let allCorrect=true;
        lessonData.exercises.forEach(e=>{
          const value=normalize($("#"+e.id).value);
          const ok=e.answers.some(a=>normalize(a)===value);
          $("#"+e.id+"-feedback").innerHTML=ok
            ? '<span class="correct">✓ Chính xác</span>'
            : `<span class="wrong">✘ Đáp án gợi ý: ${esc(e.answers[0])}</span>`;
          if(!ok) allCorrect=false;
        });
        if(allCorrect && !state.completed.includes("exercises")){
          state.completed.push("exercises");saveState();updateProgress();
        }
      };

      $("#gradeQuiz").onclick=()=>{
        let score=0;
        lessonData.quiz.forEach(q=>{
          const selected=document.querySelector(`input[name="${q.id}"]:checked`);
          if(selected && Number(selected.value)===q.answer) score++;
        });
        const percent=Math.round(score/lessonData.quiz.length*100);
        state.quizScore=Math.max(state.quizScore,percent);
        if(percent>=80 && !state.completed.includes("quiz")) state.completed.push("quiz");
        saveState();updateProgress();
        const box=$("#scoreBox");
        box.style.display="block";
        box.textContent=`Bạn đạt ${score}/${lessonData.quiz.length} câu (${percent}%). Điểm cao nhất: ${state.quizScore}%.`;
      };

      $$(".flashcard").forEach(card=>{
        const flip=()=>card.classList.toggle("flipped");
        card.onclick=e=>{
          if(e.target.closest("button")) return;
          flip();
        };
        card.onkeydown=e=>{
          if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}
        };
      });

      $$(".remembered-btn").forEach(btn=>btn.onclick=()=>{
        localStorage.setItem(key(`card:${btn.dataset.id}`),"remembered");
        btn.textContent="✓ Đã lưu";
      });
      $$(".review-btn").forEach(btn=>btn.onclick=()=>{
        const reviewData={status:"review",updatedAt:new Date().toISOString()};
        localStorage.setItem(key(`card:${btn.dataset.id}`),JSON.stringify(reviewData));
        btn.textContent="✓ Sẽ ôn lại";
      });

      let noteTimer;
      $("#notesArea").addEventListener("input",e=>{
        state.notes=e.target.value;
        $("#noteStatus").textContent="Đang lưu...";
        clearTimeout(noteTimer);
        noteTimer=setTimeout(()=>{
          saveState();
          $("#noteStatus").textContent="Đã tự động lưu.";
        },400);
      });

      $("#finishLesson").onclick=()=>{
        const finished=trackedSections.every(id=>state.completed.includes(id));
        if(finished && state.quizScore>=80){
          $("#completionBox").innerHTML="<h2>🎉 Chúc mừng!</h2><p>Bạn đã hoàn thành bài học với kết quả đạt yêu cầu.</p>";
        }else{
          const missing=trackedSections.filter(id=>!state.completed.includes(id)).length;
          alert(`Bạn còn ${missing} phần chưa đánh dấu hoàn thành. Điểm quiz cao nhất hiện tại: ${state.quizScore}%.`);
        }
      };
    }

    render();
    renderVocabulary();
    bindEvents();
    updateProgress();
  </script>
</body>
</html>
