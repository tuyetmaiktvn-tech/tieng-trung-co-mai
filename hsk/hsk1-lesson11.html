  <meta name="description" content="HSK1 Bài 11: 我读大学呢 – học hành động đang diễn ra, câu hỏi chính phản và cách dùng 要." />
  <meta name="theme-color" content="#2563eb" />
  <title>HSK1 Bài 11: 我读大学呢 | Tiếng Trung Cô Mai</title>

  <style>
    :root{
      --bg:#f6f8fc;
      --surface:#ffffff;
      --surface-2:#f8fafc;
      --text:#172033;
      --muted:#64748b;
      --line:#e2e8f0;
      --primary:#2563eb;
      --primary-2:#7c3aed;
      --success:#16a34a;
      --warning:#d97706;
      --danger:#dc2626;
      --shadow:0 14px 40px rgba(15,23,42,.08);
      --radius:20px;
      --radius-sm:12px;
      --max:1180px;
    }

    [data-theme="dark"]{
      --bg:#0f172a;
      --surface:#111827;
      --surface-2:#1e293b;
      --text:#f8fafc;
      --muted:#cbd5e1;
      --line:#334155;
      --shadow:0 18px 45px rgba(0,0,0,.28);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.65;
      transition:background .2s,color .2s;
    }

    button,input,textarea,select{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    .container{width:min(var(--max),calc(100% - 28px));margin:auto}

    .topbar{
      position:sticky;top:0;z-index:1000;
      backdrop-filter:blur(14px);
      background:color-mix(in srgb,var(--surface) 88%,transparent);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;
    }
    .brand{font-weight:900}
    .brand span{color:var(--primary)}
    .top-actions{display:flex;gap:8px;align-items:center}
    .icon-btn{
      width:42px;height:42px;border:1px solid var(--line);border-radius:12px;
      background:var(--surface);color:var(--text);display:grid;place-items:center
    }

    .progress-shell{
      position:sticky;top:68px;z-index:900;
      background:var(--surface);border-bottom:1px solid var(--line)
    }
    .progress-wrap{padding:10px 0}
    .progress-row{display:flex;justify-content:space-between;gap:16px;font-size:.9rem;color:var(--muted);margin-bottom:6px}
    .progress-bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--primary-2));transition:width .35s ease}

    .hero{padding:58px 0 30px}
    .hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:stretch}
    .hero-card,.lesson-meta,.section-card{
      background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
    }
    .hero-card{padding:30px}
    .lesson-meta{padding:24px}
    .eyebrow{
      display:inline-flex;padding:8px 12px;border-radius:999px;background:#dbeafe;color:#1d4ed8;
      font-weight:800;font-size:.9rem
    }
    [data-theme="dark"] .eyebrow{background:#1e3a8a;color:#dbeafe}
    h1{font-size:clamp(2rem,5vw,4rem);line-height:1.08;margin:16px 0 10px}
    h2{font-size:clamp(1.45rem,3vw,2.1rem);margin:0}
    h3{margin-top:0}
    .subtitle{font-size:1.08rem;color:var(--muted);margin:0}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .btn{
      border:0;border-radius:12px;padding:12px 16px;font-weight:800;
      background:var(--surface-2);color:var(--text)
    }
    .btn-primary{background:var(--primary);color:white}
    .btn-success{background:var(--success);color:white}
    .meta-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .meta-item{padding:14px;border-radius:14px;background:var(--surface-2)}
    .meta-item strong{display:block;font-size:1.2rem}

    .section{padding:18px 0}
    .section-heading{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:14px}
    .section-heading p{margin:4px 0 0;color:var(--muted)}
    .section-card{padding:24px}
    .complete-btn{
      border:1px solid var(--line);background:var(--surface);color:var(--text);
      border-radius:10px;padding:9px 12px;font-weight:700
    }
    .complete-btn.done{background:#dcfce7;color:#166534;border-color:#86efac}

    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

    .objective,.memory-item,.grammar-card,.mistake-card,.summary-item{
      padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)
    }

    .search-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
    .search-row input{
      flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
      background:var(--surface);color:var(--text)
    }

    .vocab-card{
      position:relative;padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)
    }
    .vocab-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px}
    .mini-btn{
      width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
      background:var(--surface-2);color:var(--text)
    }
    .mini-btn.active{background:#fef3c7;color:#92400e}
    .hanzi{font-size:2rem;font-weight:900;color:var(--primary);padding-right:78px}
    .pinyin{color:var(--primary-2);font-weight:800}
    .meaning{font-weight:800;margin:6px 0}
    .example{font-size:.94rem;color:var(--muted);margin-top:8px}

    .formula{
      padding:14px;text-align:center;border-radius:14px;background:var(--surface-2);
      color:var(--primary);font-weight:900;margin:12px 0
    }
    .note{padding:12px 14px;border-left:4px solid var(--warning);background:var(--surface-2);border-radius:10px}
    .wrong{color:var(--danger);font-weight:800}
    .correct{color:var(--success);font-weight:800}

    .mindmap{
      display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:18px;align-items:center
    }
    .mind-col{display:grid;gap:12px}
    .mind-node{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:center;font-weight:800}
    .mind-center{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:white;font-size:1.7rem;padding:26px}

    .dialogue-list{display:grid;gap:12px}
    .bubble{max-width:82%;padding:14px 16px;border-radius:18px;background:#dbeafe}
    .bubble.right{margin-left:auto;background:#ede9fe}
    [data-theme="dark"] .bubble{background:#1e3a8a}
    [data-theme="dark"] .bubble.right{background:#4c1d95}
    .speaker{font-weight:900}
    .pinyin-line,.vi-line{font-size:.93rem;color:var(--muted)}
    .hide{display:none!important}

    .audio-block{
      display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
      padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)
    }

    .exercise,.quiz-question{padding:16px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
    .exercise input,.exercise textarea,.notes-area{
      width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text)
    }
    .feedback{margin-top:8px;min-height:22px}
    .quiz-question label{display:block;padding:8px;border-radius:9px}
    .quiz-question label:hover{background:var(--surface-2)}
    .score-box{display:none;margin-top:12px;padding:14px;border-radius:12px;background:#dcfce7;color:#166534;font-weight:900}

    .flashcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .flashcard{height:210px;perspective:1000px}
    .flashcard-inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
    .flashcard.flipped .flashcard-inner{transform:rotateY(180deg)}
    .flash-face{
      position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);
      border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:18px;box-shadow:var(--shadow)
    }
    .flash-back{transform:rotateY(180deg)}
    .flash-face strong{font-size:2rem;color:var(--primary)}
    .flash-actions{display:flex;gap:8px;margin-top:12px}

    .favorite-panel{display:none;margin-top:14px}
    .favorite-panel.show{display:block}
    .favorite-list{display:flex;gap:8px;flex-wrap:wrap}
    .favorite-chip{padding:8px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}

    .completion{
      text-align:center;padding:28px;border-radius:20px;background:linear-gradient(135deg,#dcfce7,#dbeafe)
    }
    [data-theme="dark"] .completion{background:linear-gradient(135deg,#14532d,#1e3a8a)}
    footer{padding:38px 0;text-align:center;color:var(--muted)}

    @media (max-width:900px){
      .hero-grid,.grid-2,.grid-3,.grid-4,.mindmap{grid-template-columns:1fr}
      .flashcards{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:560px){
      .container{width:min(100% - 20px,var(--max))}
      .hero{padding-top:34px}
      .hero-card,.lesson-meta,.section-card{padding:18px}
      .meta-grid,.flashcards{grid-template-columns:1fr}
      .bubble{max-width:94%}
      .progress-shell{top:68px}
      .top-actions .text-label{display:none}
    }
  </style>

      "title": "1. Câu hỏi chính phản 正反问",
      "explanation": "Câu hỏi chính phản đặt dạng khẳng định và phủ định cạnh nhau. Với động từ hoặc tính từ thường dùng A不A; khi hỏi hành động đã xảy ra hay chưa, có thể dùng V没V.",
      "formula": "Động từ/Tính từ + 不/没 + Động từ/Tính từ？",
      "examples": [
        "你去不去学校？",
        "它是不是在超市后边？",
        "你开车没开车？",
        "这件衣服好看不好看？"
      ],
      "note": "Không thêm 吗 ở cuối câu hỏi chính phản. Không nói 你去不去吗？"
    },
    {
      "title": "2. Hành động đang diễn ra với 在 / 正在 / 呢",
      "explanation": "在 hoặc 正在 đứng trước động từ để biểu thị hành động đang tiến hành. 呢 có thể đứng cuối câu. Có ba dạng thường gặp.",
      "formula": "在/正在 + V；在/正在 + V + 呢；V + 呢",
      "examples": [
        "我正在找饭店呢。",
        "学生们在上课呢。",
        "我读大学呢。",
        "弟弟还在睡觉。"
      ],
      "note": "Phủ định dùng 没（有）+ V, không dùng 不在 + V khi phủ định hành động hiện tại."
    },
    {
      "title": "3. Động từ năng nguyện 要",
      "explanation": "要 đứng trước động từ, biểu thị mong muốn, ý định hoặc kế hoạch sẽ thực hiện một việc.",
      "formula": "Chủ ngữ + 要 + Động từ + Tân ngữ",
      "examples": [
        "他今天要和小朋友玩。",
        "妈妈要去超市。",
        "我明天要在家学习中文。"
      ],
      "note": "要 trong bài này mang nghĩa “muốn/định”, không phải nghĩa “cần, phải”."

    /* =========================================================
       3. HÀM TIỆN ÍCH
       ========================================================= */
    const $ = selector => document.querySelector(selector);
    const $$ = selector => [...document.querySelectorAll(selector)];

    function esc(text=""){
      return String(text).replace(/[&<>"']/g, m => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
      }[m]));
    }

    function normalize(text=""){
      return text.toLowerCase().replace(/[，。！？,.!?]/g,"").replace(/\s+/g,"").trim();
    }

    function speak(text,audioUrl=""){
      if(audioUrl){
        const audio = new Audio(audioUrl);
        audio.play().catch(()=>{});
        return;
      }
      if("speechSynthesis" in window){
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "zh-CN";
        utterance.rate = 0.85;
        speechSynthesis.speak(utterance);
      } else {
        alert("Trình duyệt chưa hỗ trợ phát âm tự động.");
      }
    }

    function sectionShell(id,icon,title,subtitle,content){
      const done = state.completed.includes(id);
      return `
        <section class="section" id="${id}">
          <div class="container">
            <div class="section-heading">
              <div><h2>${icon} ${title}</h2><p>${subtitle}</p></div>
              <button class="complete-btn ${done?"done":""}" data-complete="${id}">
                ${done?"✓ Đã hoàn thành":"Đánh dấu hoàn thành"}
              </button>
            </div>
            ${content}
          </div>
        </section>`;
    }

    function renderVocabulary(filter=""){
      const grid = $("#vocabGrid");
      const q = normalize(filter);
      const items = lessonData.vocabulary.filter(v =>
        normalize(v.hanzi+" "+v.pinyin+" "+v.meaning+" "+v.type).includes(q)
      );

      grid.innerHTML = items.map(v=>`
        <article class="vocab-card">
          <div class="vocab-actions">
            <button class="mini-btn vocab-speak" data-text="${esc(v.hanzi)}" data-audio="${esc(v.audio)}">🔊</button>
            <button class="mini-btn favorite-btn ${state.favorites.includes(v.id)?"active":""}" data-id="${v.id}">⭐</button>
          </div>
          <div class="hanzi">${esc(v.hanzi)}</div>
          <div class="pinyin">${esc(v.pinyin)}</div>
          <div class="meaning">${esc(v.meaning)}</div>
          <small>${esc(v.type)}</small>
          <div class="example">${esc(v.example)}<br>${esc(v.examplePinyin)}<br>${esc(v.exampleVi)}</div>
        </article>`).join("") || `<p>Không tìm thấy từ phù hợp.</p>`;

      bindVocabularyEvents();
      renderFavorites();
    }

    function renderFavorites(){
      const list = $("#favoriteList");
      if(!list) return;
      const words = lessonData.vocabulary.filter(v=>state.favorites.includes(v.id));
      list.innerHTML = words.length
        ? words.map(v=>`<span class="favorite-chip">${esc(v.hanzi)} · ${esc(v.meaning)}</span>`).join("")
        : "<span>Chưa có từ yêu thích.</span>";
    }

    function bindVocabularyEvents(){
      $$(".vocab-speak").forEach(btn=>btn.onclick=()=>speak(btn.dataset.text,btn.dataset.audio));
      $$(".favorite-btn").forEach(btn=>btn.onclick=()=>{
        const id = btn.dataset.id;
        state.favorites = state.favorites.includes(id)
          ? state.favorites.filter(x=>x!==id)
          : [...state.favorites,id];
        saveState();
        renderVocabulary($("#vocabSearch")?.value || "");
      });
    }

    /* =========================================================
       6. TIẾN ĐỘ
       ========================================================= */
    const trackedSections = ["objectives","vocabulary","memory","grammar","mistakes","mindmap","dialogue","listening","speaking","exercises","quiz","summary","flashcards","notes"];

    function updateProgress(){
      const count = trackedSections.filter(id=>state.completed.includes(id)).length;
      const percent = Math.round(count / trackedSections.length * 100);
      $("#progressFill").style.width = percent+"%";
      $("#progressText").textContent = percent+"%";
      $$(".complete-btn").forEach(btn=>{
        const done = state.completed.includes(btn.dataset.complete);
        btn.classList.toggle("done",done);
        btn.textContent = done ? "✓ Đã hoàn thành" : "Đánh dấu hoàn thành";
      });
    }

    function toggleComplete(id){
      state.completed = state.completed.includes(id)
        ? state.completed.filter(x=>x!==id)
        : [...state.completed,id];
      saveState();
      updateProgress();
    }

    /* =========================================================
       7. SỰ KIỆN
       ========================================================= */
    function bindEvents(){
      $$(".complete-btn").forEach(btn=>btn.onclick=()=>toggleComplete(btn.dataset.complete));

      $("#vocabSearch").addEventListener("input",e=>renderVocabulary(e.target.value));
      $("#clearSearch").onclick=()=>{
        $("#vocabSearch").value="";
        renderVocabulary("");
      };

      $("#favoritesToggle").onclick=()=>{
        $("#favoritePanel").classList.toggle("show");
        location.hash="#vocabulary";
      };

      $("#themeToggle").onclick=()=>{
        state.theme = state.theme==="dark" ? "light" : "dark";
        document.documentElement.dataset.theme = state.theme;
        localStorage.setItem("site-theme",state.theme);
        $("#themeToggle").textContent = state.theme==="dark" ? "☀️" : "🌙";
      };
      $("#themeToggle").textContent = state.theme==="dark" ? "☀️" : "🌙";

      $$(".speak-btn").forEach(btn=>btn.onclick=()=>speak(btn.dataset.speak));
      $$(".dialogue-speak").forEach(btn=>btn.onclick=()=>speak(btn.dataset.text,btn.dataset.audio));
      $$(".speaking-speak").forEach(btn=>btn.onclick=()=>speak(btn.dataset.text));

      $("#togglePinyin").onclick=()=>{
        state.hidePinyin=!state.hidePinyin;
        saveState();
        $$(".pinyin-line").forEach(el=>el.classList.toggle("hide",state.hidePinyin));
        $("#togglePinyin").textContent=state.hidePinyin?"Hiện pinyin":"Ẩn pinyin";
      };
      $("#toggleVi").onclick=()=>{
        state.hideVi=!state.hideVi;
        saveState();
        $$(".vi-line").forEach(el=>el.classList.toggle("hide",state.hideVi));
        $("#toggleVi").textContent=state.hideVi?"Hiện bản dịch":"Ẩn bản dịch";
      };

      $("#listenPlay").onclick=()=>{
        const l = lessonData.listening;
        if(l.audio) new Audio(l.audio).play().catch(()=>{});
        else speak("我正在找饭店呢。");
      };

      $("#checkListening").onclick=()=>{
        const selected = document.querySelector('input[name="listenQ"]:checked');
        const fb = $("#listeningFeedback");
        if(!selected){fb.innerHTML='<span class="wrong">Hãy chọn một đáp án.</span>';return}
        fb.innerHTML = Number(selected.value)===lessonData.listening.answer
          ? '<span class="correct">✓ Chính xác</span>'
          : '<span class="wrong">✘ Chưa đúng</span>';
      };

      $("#checkExercises").onclick=()=>{
        let allCorrect=true;
        lessonData.exercises.forEach(e=>{
          const value=normalize($("#"+e.id).value);
          const ok=e.answers.some(a=>normalize(a)===value);
          $("#"+e.id+"-feedback").innerHTML=ok
            ? '<span class="correct">✓ Chính xác</span>'
            : `<span class="wrong">✘ Đáp án gợi ý: ${esc(e.answers[0])}</span>`;
          if(!ok) allCorrect=false;
        });
        if(allCorrect && !state.completed.includes("exercises")){
          state.completed.push("exercises");saveState();updateProgress();
        }
      };

      $("#gradeQuiz").onclick=()=>{
        let score=0;
        lessonData.quiz.forEach(q=>{
          const selected=document.querySelector(`input[name="${q.id}"]:checked`);
          if(selected && Number(selected.value)===q.answer) score++;
        });
        const percent=Math.round(score/lessonData.quiz.length*100);
        state.quizScore=Math.max(state.quizScore,percent);
        if(percent>=80 && !state.completed.includes("quiz")) state.completed.push("quiz");
        saveState();updateProgress();
        const box=$("#scoreBox");
        box.style.display="block";
        box.textContent=`Bạn đạt ${score}/${lessonData.quiz.length} câu (${percent}%). Điểm cao nhất: ${state.quizScore}%.`;
      };

      $$(".flashcard").forEach(card=>{
        const flip=()=>card.classList.toggle("flipped");
        card.onclick=e=>{
          if(e.target.closest("button")) return;
          flip();
        };
        card.onkeydown=e=>{
          if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}
        };
      });

      $$(".remembered-btn").forEach(btn=>btn.onclick=()=>{
        localStorage.setItem(key(`card:${btn.dataset.id}`),"remembered");
        btn.textContent="✓ Đã lưu";
      });
      $$(".review-btn").forEach(btn=>btn.onclick=()=>{
        const reviewData={status:"review",updatedAt:new Date().toISOString()};
        localStorage.setItem(key(`card:${btn.dataset.id}`),JSON.stringify(reviewData));
        btn.textContent="✓ Sẽ ôn lại";
      });

      let noteTimer;
      $("#notesArea").addEventListener("input",e=>{
        state.notes=e.target.value;
        $("#noteStatus").textContent="Đang lưu...";
        clearTimeout(noteTimer);
        noteTimer=setTimeout(()=>{
          saveState();
          $("#noteStatus").textContent="Đã tự động lưu.";
        },400);
      });

      $("#finishLesson").onclick=()=>{
        const finished=trackedSections.every(id=>state.completed.includes(id));
        if(finished && state.quizScore>=80){
          $("#completionBox").innerHTML="<h2>🎉 Chúc mừng!</h2><p>Bạn đã hoàn thành bài học với kết quả đạt yêu cầu.</p>";
        }else{
          const missing=trackedSections.filter(id=>!state.completed.includes(id)).length;
          alert(`Bạn còn ${missing} phần chưa đánh dấu hoàn thành. Điểm quiz cao nhất hiện tại: ${state.quizScore}%.`);
        }
      };
    }

    render();
    renderVocabulary();
    bindEvents();
    updateProgress();
  </script>
<script src="../assets/js/focus-section.js"></script>
</body>
</html>
