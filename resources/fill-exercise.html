<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bài tập điền trống | Tiếng Trung Cô Mai</title><link rel="stylesheet" href="../assets/css/style.css?v=3.3.1"><style>
:root{--ink:#17324d;--blue:#3978c5;--line:#cfdef0;--soft:#f3f8ff;--green:#19724e;--red:#b73b38}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f8fbff,#f1faf6);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}.hero{padding:48px 20px 40px;text-align:center;background:linear-gradient(135deg,#e9f3ff,#e4f8ef);border-bottom:1px solid #d7e5e3}.hero h1{margin:0 0 12px;font-size:clamp(32px,5vw,50px);font-family:"Microsoft YaHei","Segoe UI",sans-serif}.hero p{margin:0;color:#50697b;font-size:18px}.back{display:inline-block;margin-top:18px;color:#29465f;font-weight:700}.shell{max-width:980px;margin:auto;padding:30px 18px 64px}.card{padding:clamp(22px,4vw,40px);border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 12px 30px rgba(38,70,94,.09)}.heading{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px;padding-bottom:20px;border-bottom:2px solid var(--line)}.heading h2{margin:0 0 7px;color:#255c9f;font-size:30px}.heading p{margin:0;color:#607181}.badge{flex:0 0 auto;height:max-content;padding:7px 12px;border-radius:999px;background:#e5f7ef;color:var(--green);font-size:14px;font-weight:750}.questions{display:grid;gap:16px;margin:0;padding:0;list-style:none;counter-reset:item}.question{counter-increment:item;padding:19px 20px;border:1px solid #dce8f4;border-radius:15px;background:var(--soft)}.question:before{content:"Câu " counter(item);display:block;margin-bottom:10px;color:#255c9f;font-weight:800}.sentence{margin:0;font:20px/2.05 "Microsoft YaHei","Noto Sans SC",sans-serif;color:#243c50}.blank{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}.blank-number{font:700 14px "Segoe UI",Arial,sans-serif;color:#63798b}.choice{min-width:86px;max-width:150px;padding:6px 28px 6px 9px;border:2px solid #9cbcdf;border-radius:9px;background:#fff;color:#17324d;font:18px "Microsoft YaHei",sans-serif}.choice.is-correct{border-color:#4ca476;background:#effaf4}.choice.is-wrong{border-color:#d46b67;background:#fff1f0}.feedback{min-height:22px;margin:9px 0 0;font-size:15px;font-weight:700}.feedback.correct{color:var(--green)}.feedback.wrong{color:var(--red)}.actions{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:24px}.button{padding:11px 18px;border:1px solid var(--blue);border-radius:999px;background:#fff;color:#255c9f;font:750 16px "Segoe UI",sans-serif;cursor:pointer}.button.primary{background:var(--blue);color:#fff}.score{margin-left:auto;font-size:17px;font-weight:800;color:#255c9f}.answers{display:none;margin-top:22px;padding:18px 20px;border-left:5px solid #58a98c;border-radius:0 14px 14px 0;background:#f1fbf7}.answers.visible{display:block}.answers h3{margin:0 0 12px;color:var(--green)}.answers ol{columns:2;gap:32px;margin:0;padding-left:25px}.answers li{margin-bottom:7px;break-inside:avoid;font:18px/1.55 "Microsoft YaHei",sans-serif}@media(max-width:700px){.shell{padding:20px 9px 44px}.card{padding:17px 13px}.heading{flex-direction:column}.question{padding:15px 13px}.sentence{font-size:18px;line-height:2.25}.actions{flex-direction:column}.button{width:100%}.score{margin:5px 0}.answers ol{columns:1}}@media print{body{display:none!important}}
</style></head><body><main><section class="hero"><h1 id="title">Bài tập điền trống</h1><p>Chọn từ thích hợp cho từng chỗ trống rồi chấm bài.</p><a class="back" href="fill-exercises.html">← Trở về danh sách bài điền trống</a></section><div class="shell"><article class="card"><header class="heading"><div><h2 id="instruction"></h2><p id="summary"></p></div><span class="badge">Chỉ làm trực tuyến</span></header><ol class="questions" id="questions"></ol><div class="actions"><button class="button primary" id="check">Chấm bài</button><button class="button" id="show">Xem đáp án</button><button class="button" id="reset">Làm lại</button><span class="score" id="score" aria-live="polite"></span></div><section class="answers" id="answers"><h3>Đáp án</h3><ol id="answer-list"></ol></section></article></div></main><script src="fill-exercise-data.js?v=1"></script><script>
const id=new URLSearchParams(location.search).get('id'),data=window.FILL_EXERCISES[id],titleEl=document.getElementById('title'),instructionEl=document.getElementById('instruction'),summaryEl=document.getElementById('summary'),questionsEl=document.getElementById('questions'),checkButton=document.getElementById('check'),showButton=document.getElementById('show'),resetButton=document.getElementById('reset'),scoreEl=document.getElementById('score'),answersEl=document.getElementById('answers');let total=0;if(!data){location.replace('fill-exercises.html')}else{document.title=`${data.title} | Tiếng Trung Cô Mai`;titleEl.textContent=data.title;instructionEl.textContent=data.instruction||data.title;total=data.questions.reduce((n,q)=>n+q.answers.length,0);summaryEl.textContent=`${data.questions.length} câu · ${total} chỗ trống · Mỗi chỗ đúng được 1 điểm`;questionsEl.innerHTML=data.questions.map((q,qi)=>{let bi=0;const html=q.text.replace(/\{\{\}\}/g,()=>{const opts=data.options.map(x=>`<option value="${x}">${x}</option>`).join('');return `<span class="blank"><span class="blank-number">(${++bi})</span><select class="choice" data-q="${qi}" data-a="${bi-1}" aria-label="Câu ${qi+1}, chỗ trống ${bi}"><option value="">—</option>${opts}</select></span>`});return `<li class="question"><p class="sentence" lang="zh-Hans">${html}</p><p class="feedback" aria-live="polite"></p></li>`}).join('');document.getElementById('answer-list').innerHTML=data.questions.map(q=>`<li>${q.answers.map((a,i)=>`(${i+1}) ${a}`).join('　')}</li>`).join('')}
checkButton.onclick=()=>{let right=0;document.querySelectorAll('.question').forEach((q,qi)=>{let okQ=true;q.querySelectorAll('.choice').forEach(s=>{const ok=s.value===data.questions[qi].answers[+s.dataset.a];right+=ok?1:0;okQ=okQ&&ok;s.classList.toggle('is-correct',ok);s.classList.toggle('is-wrong',!ok)});const f=q.querySelector('.feedback');f.textContent=okQ?'Chính xác':'Chưa đúng, hãy kiểm tra lại';f.className=`feedback ${okQ?'correct':'wrong'}`});scoreEl.textContent=`Kết quả: ${right}/${total}`};showButton.onclick=()=>{const visible=answersEl.classList.toggle('visible');showButton.textContent=visible?'Ẩn đáp án':'Xem đáp án'};resetButton.onclick=()=>{document.querySelectorAll('.choice').forEach(s=>{s.value='';s.classList.remove('is-correct','is-wrong')});document.querySelectorAll('.feedback').forEach(f=>{f.textContent='';f.className='feedback'});scoreEl.textContent='';scrollTo({top:0,behavior:'smooth'})};document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase()))e.preventDefault()});
</script></body></html>
