<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bài tập điền trống | Tiếng Trung Cô Mai</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.3.1">
  <style>
    body{margin:0;background:linear-gradient(180deg,#edf4fb,#eaf5ef);color:#102a43;font-family:"Segoe UI",Arial,sans-serif}.hero{padding:54px 20px 46px;text-align:center;background:linear-gradient(135deg,#cfe4fb,#d7eee4);border-bottom:1px solid #a9c7c2}.hero h1{margin:0 0 12px;color:#123c68;font-size:clamp(36px,6vw,56px);font-weight:800}.hero p{margin:0 auto;max-width:720px;color:#314e63;font-size:19px;line-height:1.6}.back{display:inline-block;margin-top:20px;color:#173f60;font-weight:750}.shell{max-width:1050px;margin:auto;padding:34px 18px 68px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{display:block;padding:24px;border:1px solid #a8c2dc;border-radius:18px;background:#fff;color:inherit;text-decoration:none;box-shadow:0 10px 24px rgba(24,58,84,.15);transition:.2s}.card:hover{transform:translateY(-3px);border-color:#4d83b8;box-shadow:0 14px 30px rgba(24,58,84,.2)}.card h2{margin:0 0 10px;color:#174f87;font:700 25px/1.4 KaiTi,STKaiti,"Microsoft YaHei",sans-serif}.card p{margin:0;color:#3e5669;font-weight:600;line-height:1.55}.tag{display:inline-block;margin-top:16px;padding:6px 10px;border-radius:999px;background:#d9eafb;color:#174f87;font-size:14px;font-weight:800}@media print{body{display:none!important}}
  </style>
</head>
<body><main><section class="hero"><h1>Bài tập điền trống</h1><p>Chọn một bài để làm trực tuyến. Hệ thống tự chấm điểm, hiển thị đáp án và cho phép làm lại.</p><a class="back" href="extended-exercises.html">← Trở về Bài tập mở rộng</a></section><div class="shell"><div class="grid" id="exercise-grid"><a class="card" href="fill-bu-mei.html"><h2>Điền 不 hoặc 没</h2><p>9 câu · 17 chỗ trống</p><span class="tag">Làm bài trực tuyến</span></a></div></div></main>
<script src="fill-exercise-data.js?v=1"></script><script>const grid=document.getElementById('exercise-grid');Object.entries(window.FILL_EXERCISES).forEach(([id,item])=>{const blanks=item.questions.reduce((n,q)=>n+q.answers.length,0);grid.insertAdjacentHTML('beforeend',`<a class="card" href="fill-exercise.html?id=${encodeURIComponent(id)}"><h2>${item.title}</h2><p>${item.questions.length} câu · ${blanks} chỗ trống</p><span class="tag">Làm bài trực tuyến</span></a>`)});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['s','p','u'].includes(e.key.toLowerCase()))e.preventDefault()});</script></body></html>
