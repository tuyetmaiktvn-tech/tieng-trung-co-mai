<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chữa câu sai | Bài tập mở rộng | Tiếng Trung Cô Mai</title>
  <link rel="stylesheet" href="../assets/css/style.css?v=3.3.1">
  <style>
    :root{--ink:#17324d;--orange:#e96f2d;--orange-dark:#b84c18;--line:#efd9ca;--green:#147054}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#fffaf5,#f2faf7);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
    .correction-hero{padding:52px 20px 44px;text-align:center;background:linear-gradient(135deg,#fff0d7,#def7ed);border-bottom:1px solid #eaded4}
    .correction-hero h1{margin:0 0 12px;font-size:clamp(38px,6vw,58px);line-height:1.1}
    .correction-hero p{max-width:820px;margin:0 auto;color:#496174;font-size:clamp(17px,2vw,20px);line-height:1.6}
    .back-link{display:inline-block;margin-top:20px;color:#29465f;font-weight:700}
    .exercise-shell{max-width:980px;margin:0 auto;padding:28px 18px 64px}
    .exercise-tools{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px;padding:13px 16px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.96);box-shadow:0 5px 18px rgba(44,64,74,.08)}
    .exercise-tools strong{font-size:16px}.jump-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .jump-links a{padding:7px 11px;border-radius:999px;background:#fff3e9;color:var(--orange-dark);font-size:14px;font-weight:750;text-decoration:none}
    .exercise-list{display:grid;gap:18px}.exercise-item{scroll-margin-top:86px;padding:22px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(44,64,74,.07)}
    .item-number{display:inline-grid;place-items:center;min-width:42px;height:34px;margin-bottom:14px;padding:0 10px;border-radius:999px;background:var(--orange);color:#fff;font-weight:800}
    .source-image{position:relative;overflow:hidden;border:1px solid #e8ecea;border-radius:10px;background:#fff;user-select:none;-webkit-user-select:none}
    .source-image::after{content:"";position:absolute;inset:0;z-index:2}.source-image img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}
    .answer-label{display:block;margin:16px 0 8px;font-weight:750;color:#405668}.answer-input{display:block;width:100%;min-height:76px;padding:13px 14px;border:2px solid #bdd8d1;border-radius:12px;background:#fafffd;color:var(--ink);font:19px "Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.55;resize:vertical}
    .answer-input:focus{outline:3px solid rgba(20,112,84,.14);border-color:var(--green)}.answer-actions{display:flex;align-items:center;gap:12px;margin-top:12px}
    .reveal-button{padding:9px 15px;border:1px solid #e7b999;border-radius:999px;background:#fff5ed;color:var(--orange-dark);font:750 15px "Segoe UI",Arial,sans-serif;cursor:pointer}.saved-note{color:#6a7b87;font-size:14px}
    .answer-key{display:none;margin-top:14px;padding:14px;border-left:4px solid #54a88c;border-radius:0 12px 12px 0;background:#f1fbf7}.answer-key.is-visible{display:block}.answer-key h3{margin:0 0 10px;color:var(--green);font-size:16px}
    @media(max-width:700px){.correction-hero{padding-top:40px}.exercise-shell{padding:18px 9px 44px}.exercise-tools{align-items:flex-start;flex-direction:column}.jump-links{justify-content:flex-start}.exercise-item{padding:15px}.answer-input{font-size:17px}}
    @media print{body{display:none!important}}
  </style>
</head>
<body>
<main>
  <section class="correction-hero"><div class="container"><h1>Chữa câu sai</h1><p>Đọc câu sai, gõ lại câu đúng vào ô trả lời rồi mở đáp án ngay bên dưới để tự kiểm tra. Bài gồm 200 câu, đánh số liên tục từ 1 đến 200.</p><a class="back-link" href="extended-exercises.html">← Trở về Bài tập mở rộng</a></div></section>
  <div class="exercise-shell">
    <nav class="exercise-tools" aria-label="Điều hướng bài tập"><strong>200 câu · Chỉ làm trực tuyến</strong><div class="jump-links"><a href="#cau-1">1–50</a><a href="#cau-51">51–100</a><a href="#cau-101">101–150</a><a href="#cau-151">151–200</a></div></nav>
    <section class="exercise-list" id="exercise-list" aria-label="Danh sách 200 câu chữa câu sai"></section>
  </div>
</main>
<script src="../assets/js/app.js?v=3.3.1"></script>
<script>
const pad=value=>String(value).padStart(3,'0');
const list=document.getElementById('exercise-list');
list.innerHTML=Array.from({length:200},(_,index)=>{const number=index+1;return `<article class="exercise-item" id="cau-${number}"><span class="item-number">Câu ${number}</span><div class="source-image"><img src="../assets/images/sentence-correction/items/questions/question-${pad(number)}.jpg" alt="Câu sai số ${number}" loading="lazy" draggable="false"></div><label class="answer-label" for="answer-${number}">Gõ câu đã sửa:</label><textarea class="answer-input" id="answer-${number}" data-number="${number}" lang="zh-Hans" autocomplete="off" spellcheck="false" placeholder="Nhập câu tiếng Trung đã sửa..."></textarea><div class="answer-actions"><button class="reveal-button" type="button" aria-expanded="false" aria-controls="key-${number}">Xem đáp án</button><span class="saved-note" aria-live="polite"></span></div><div class="answer-key" id="key-${number}"><h3>Đáp án câu ${number}</h3><div class="source-image"><img src="../assets/images/sentence-correction/items/answers/answer-${pad(number)}.jpg" alt="Đáp án câu ${number}" loading="lazy" draggable="false"></div></div></article>`}).join('');
document.querySelectorAll('.answer-input').forEach(input=>{const key=`sentence-correction-${input.dataset.number}`;input.value=localStorage.getItem(key)||'';input.addEventListener('input',()=>{localStorage.setItem(key,input.value);const note=input.closest('.exercise-item').querySelector('.saved-note');note.textContent='Đã lưu trên thiết bị';clearTimeout(input.saveTimer);input.saveTimer=setTimeout(()=>note.textContent='',1400)})});
document.querySelectorAll('.reveal-button').forEach(button=>button.addEventListener('click',()=>{const answer=document.getElementById(button.getAttribute('aria-controls'));const visible=answer.classList.toggle('is-visible');button.setAttribute('aria-expanded',String(visible));button.textContent=visible?'Ẩn đáp án':'Xem đáp án'}));
document.addEventListener('contextmenu',event=>event.preventDefault());document.addEventListener('dragstart',event=>event.preventDefault());document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&['s','p','u'].includes(event.key.toLowerCase()))event.preventDefault()});
</script>
</body>
</html>
